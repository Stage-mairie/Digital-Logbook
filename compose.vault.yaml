
services:
  vault-setup:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    profiles: ["setup"]
    user: "1000:1000"
    entrypoint: ["node", "src/create-vault.js"]
    environment:
      VAULT_SECRET: ${VAULT_SECRET:?VAULT_SECRET requis}
    volumes:
      - vault_data:/app/vault
    network_mode: none
    stdin_open: true
    tty: true

volumes:
  vault_data:
