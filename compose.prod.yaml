name: digital-logbook-prod
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - db_data_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - logbook_internal

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_SSL: 'false'
      ENABLE_SIGNATURES: 'true'
      CORS_ORIGINS: http://cahier_transmission.saint-andre.re
    volumes:
      - ./backend/vault:/app/vault:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - logbook_internal

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
      args:
        API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - traefik
      - logbook_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.logbook.rule=Host(`cahier_transmission.saint-andre.re`)"
      - "traefik.http.routers.logbook.entrypoints=web"
      - "traefik.http.routers.logbook.tls=true"
      - "traefik.http.services.logbook.loadbalancer.server.port=80"
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

networks:
  traefik:
    external: true
  logbook_internal:
    internal: true

volumes:
  db_data_prod:
