name: digital-logbook-prod
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:?Renseigner DB_NAME dans .env.production}
      POSTGRES_USER: ${DB_USER:?Renseigner DB_USER dans .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Renseigner DB_PASSWORD dans .env.production}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - db_data_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_SSL: 'false'
      ENABLE_SIGNATURES: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./backend/vault:/app/vault:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    # Pas de port API publié : seul Nginx joint le backend sur le réseau Compose.

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
      args:
        # Flutter Web : même origine et reverse proxy /api -> backend.
        API_BASE_URL: /api
    ports:
      # Le proxy HTTPS du serveur termine TLS et relaie vers ce port local.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped

volumes:
  db_data_prod:
